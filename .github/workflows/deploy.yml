name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Official Cloud Production Server
      SERVER_cloud_ID: ${{ secrets.SERVER_cloud_ID }}
      SERVER_cloud_NAME: ${{ secrets.SERVER_cloud_NAME }}
      SERVER_cloud_REGION: ${{ secrets.SERVER_cloud_REGION }}
      SERVER_cloud_SUPABASE_PUBLIC_URL: ${{ secrets.SERVER_cloud_SUPABASE_PUBLIC_URL }}
      SERVER_cloud_ANON_KEY: ${{ secrets.SERVER_cloud_ANON_KEY }}
      SERVER_cloud_IS_DEFAULT: ${{ secrets.SERVER_cloud_IS_DEFAULT }}

      # Dedicated Server Franco
      SERVER_server_franco_ID: ${{ secrets.SERVER_server_franco_ID }}
      SERVER_server_franco_NAME: ${{ secrets.SERVER_server_franco_NAME }}
      SERVER_server_franco_REGION: ${{ secrets.SERVER_server_franco_REGION }}
      SERVER_server_franco_SUPABASE_PUBLIC_URL: ${{ secrets.SERVER_server_franco_SUPABASE_PUBLIC_URL }}
      SERVER_server_franco_ANON_KEY: ${{ secrets.SERVER_server_franco_ANON_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Configure official servers & build tools
        run: |
          npm run servers:configure
          npm run validate:tools

      - name: Build project
        run: npm run build
        env:
          AUDIT_SKIP_SIMILAR: 1

      - name: Create SPA 404 fallback for GitHub Pages
        run: cp ./dist/index.html ./dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
