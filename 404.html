    <style>
      @font-face {
        font-family: 'Pokemon FireRed LeafGreen';
        src: url('/PokeBorrador/fonts/pokemon-firered-leafgreen-font.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        size-adjust: 128%;
      }
      /* Eliminate FOUC (Flash of Unstyled Content) */
      html, body {
        background-color: #07080e !important;
        background: #07080e !important;
        color: #fff;
        margin: 0;
        padding: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
      }
      #app { 
        background: #07080e; 
        width: 100dvw;
        height: 100dvh; 
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
      }

      /* Estilos para el fallback de conexión offline */
      #offline-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: #07080e;
        font-family: 'Pokemon FireRed LeafGreen', 'VT323', monospace;
        padding: 20px;
        box-sizing: border-box;
      }
      
      .offline-card {
        background: rgba(15, 18, 32, 0.95);
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        width: 100%;
        max-width: 440px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.02);
        box-sizing: border-box;
        transition: border-color 0.5s ease, box-shadow 0.5s ease;
      }
      
      .offline-card.error-state {
        border-color: rgba(255, 69, 58, 0.4);
        box-shadow: 0 0 60px rgba(255, 69, 58, 0.15), inset 0 0 20px rgba(255, 69, 58, 0.05);
        animation: cardPulse 3s infinite ease-in-out;
      }
      
      @keyframes cardPulse {
        0%, 100% { border-color: rgba(255, 69, 58, 0.4); box-shadow: 0 0 50px rgba(255, 69, 58, 0.15); }
        50% { border-color: rgba(255, 69, 58, 0.8); box-shadow: 0 0 70px rgba(255, 69, 58, 0.35); }
      }
      
      .icon-header {
        margin-bottom: 24px;
      }
      
      .wifi-icon {
        display: inline-block;
        font-size: 56px;
        filter: drop-shadow(0 0 15px rgba(255, 214, 10, 0.3));
        transition: filter 0.5s ease;
      }
      
      .offline-card.error-state .wifi-icon {
        filter: drop-shadow(0 0 15px rgba(255, 69, 58, 0.6));
      }
      
      .pulse {
        animation: pulseIcon 2s infinite ease-in-out;
      }
      
      @keyframes pulseIcon {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.8; }
      }
      
      .press-start {
        font-family: 'Pokemon FireRed LeafGreen', 'VT323', monospace;
        letter-spacing: 1px;
        image-rendering: pixelated;
      }
      
      .offline-title {
        font-size: 16px;
        color: #ffd60a;
        margin: 0 0 20px 0;
        transition: color 0.5s ease;
      }
      
      .offline-card.error-state .offline-title {
        color: #ff453a;
      }
      
      .msg {
        color: rgba(255, 255, 255, 0.7);
        font-family: 'Pokemon FireRed LeafGreen', 'VT323', monospace;
        font-size: 10px;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      
      .spinner-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      
      .spinner {
        width: 36px;
        height: 36px;
        border: 3.5px solid rgba(255, 255, 255, 0.05);
        border-top: 3.5px solid #ffd60a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .status-text {
        font-size: 9px;
        color: #ffd60a;
      }
      
      .error-details {
        margin: 10px 0 24px 0;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
      }
      
      .error-details code {
        background: rgba(0, 0, 0, 0.3);
        padding: 4px 8px;
        border-radius: 6px;
        color: #ff453a;
        font-family: monospace;
      }
      
      .actions-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-top: 12px;
      }

      .retry-btn-modern {
        background: #ff453a;
        color: #ffffff;
        border: 2px solid #ffffff;
        padding: 14px 28px;
        font-size: 10px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 69, 58, 0.3);
        transition: all 0.2s ease;
        outline: none;
        width: 100%;
        box-sizing: border-box;
      }
      
      .retry-btn-modern:hover {
        transform: translateY(-2px);
        background: #ffffff;
        color: #ff453a;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2), 0 0 20px rgba(255, 255, 255, 0.4);
      }
      
      .retry-btn-modern:active {
        transform: translateY(1px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
      }

      .login-btn-modern {
        background: rgba(255, 255, 255, 0.08);
        color: #ffd60a;
        border: 2px solid rgba(255, 214, 10, 0.4);
        padding: 12px 24px;
        font-size: 9px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        transition: all 0.2s ease;
        outline: none;
        width: 100%;
        box-sizing: border-box;
      }

      .login-btn-modern:hover {
        transform: translateY(-2px);
        background: rgba(255, 214, 10, 0.2);
        border-color: #ffd60a;
        color: #ffffff;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2), 0 0 15px rgba(255, 214, 10, 0.3);
      }

      .login-btn-modern:active {
        transform: translateY(1px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
      }

    <script>
      // Función para mostrar pantalla de error si falla la carga o no hay internet
      function showOfflineScreen() {
        if (typeof window !== 'undefined' && window.__E2E__) return;
        var card = document.getElementById('offline-card');
        var icon = document.getElementById('offline-icon');
        var title = document.getElementById('offline-title');
        var message = document.getElementById('offline-message');
        var loader = document.getElementById('offline-loader');
        var errorContent = document.getElementById('offline-error-content');
        
        if (card) card.className = 'offline-card error-state';
        if (icon) {
          icon.innerHTML = '⚠️';
          icon.className = 'wifi-icon pulse';
        }
        if (title) title.innerHTML = 'CONEXIÓN FALLIDA';
        if (message) message.innerHTML = 'El servidor de Poké Vicio está fuera de línea o no tienes conexión a internet.';
        if (loader) loader.style.display = 'none';
        if (errorContent) errorContent.style.display = 'block';
      }

      function retryConnection() {
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(r) {
                if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
                r.update().catch(function() {});
              });
            }).catch(function() {});
          } catch (e) {}
        }
        var cacheBuster = Date.now();
        var url = new URL(window.location.href);
        url.searchParams.set('reload_t', String(cacheBuster));
        window.location.replace(url.toString());
      }

      function forceLoginAndFreshUpdate() {
        try {
          if (typeof sessionStorage !== 'undefined') {
            sessionStorage.clear();
            sessionStorage.setItem('block_autologin', 'true');
          }
          if (typeof localStorage !== 'undefined') {
            localStorage.removeItem('pokevicio_local_user');
            localStorage.removeItem('pokevicio_session_mode');
          }
        } catch (e) {}

        if ('caches' in window) {
          try {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(key) { return caches.delete(key); }));
            }).catch(function() {});
          } catch (e) {}
        }

        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(r) {
                if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
                r.update().catch(function() {});
              });
            }).catch(function() {});
          } catch (e) {}
        }

        var target = '/login?fresh_t=' + Date.now();
        window.location.replace(target);
      }

      // Si el navegador ya detecta que no hay internet, actuar de inmediato
      if (typeof navigator !== 'undefined' && !navigator.onLine && (typeof window === 'undefined' || !window.__E2E__)) {
        setTimeout(showOfflineScreen, 0);
      }

      // Capturar fallos en la carga del script principal o assets
      function handleEntryPointError() {
        if (typeof window !== 'undefined' && window.__E2E__) return;
        showOfflineScreen();
      }

      // Fallback de seguridad: si después de 6 segundos Vue no se ha montado, mostrar error
      setTimeout(function() {
        if (typeof window !== 'undefined' && !window.pwa_app_mounted && !window.__E2E__) {
          showOfflineScreen();
        }
      }, 6000);
    </script>
