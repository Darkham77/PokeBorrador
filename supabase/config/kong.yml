_format_version: '1.1'

services:
  - name: auth
    url: http://gotrue:9999
    routes:
      - name: auth
        paths:
          - /auth/v1
        strip_path: true

  - name: rest
    url: http://postgrest:3000
    routes:
      - name: rest
        paths:
          - /rest/v1
        strip_path: true

  - name: realtime
    url: http://realtime:4000
    routes:
      - name: realtime
        paths:
          - /realtime/v1
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - '*'
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Language
        - Content-Language
        - Content-Type
        - Authorization
        - x-client-info
        - apikey
        - x-customer-jwt
      exposed_headers:
        - Content-Range
        - X-Total-Count
      max_age: 3600
      credentials: true

  - name: key-auth
    config:
      key_names:
        - apikey

