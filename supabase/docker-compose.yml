# POKÉ VICIO - CONFIGURACIÓN MAESTRA SUPABASE (ESTÁNDAR MAYO 2026)
# Optimizada para QNAP NAS y sincronización de roles automática.

version: '3.8'

services:
  # === BASE DE DATOS ===
  db:
    container_name: supabase-db-pokevicio
    image: ${DOCKER_USER:-pokevicio}/${DOCKER_REPO_DB:-pokevicio-db}:${DOCKER_TAG_DB:-latest}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ${PROJECT_ROOT:-.}/db/data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  # === AUTENTICACIÓN ===
  gotrue:
    container_name: supabase-auth-pokevicio
    image: supabase/gotrue:v2.186.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@pokevicio.io}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Poké Vicio Online}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # === API REST (POSTGREST) ===
  postgrest:
    container_name: supabase-postgrest-pokevicio
    image: postgrest/postgrest:v14.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_CHECK_CONSTRAINTS: true
      PGRST_DB_MAX_ROWS: 1000
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # === TIEMPO REAL ===
  realtime:
    # El nombre del contenedor es mandatorio para el tenant ID en versiones 2026
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.76.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: 'false'
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      REPLICATION_MODE: RLS
      REPLICATION_SLOT_NAME: supabase_realtime_replication_slot
      PUBLICATION_NAME: supabase_realtime
      SECURE_CHANNELS: 'true'
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # === PROXY (KONG) ===
  kong:
    container_name: supabase-kong-pokevicio
    image: kong:3.9.1
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api-gw
    depends_on:
      db:
        condition: service_healthy
      gotrue:
        condition: service_started
      postgrest:
        condition: service_started
      realtime:
        condition: service_started
    ports:
      - ${KONG_HTTP_PORT}:8000
      - ${KONG_HTTPS_PORT}:8443
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/declarative/kong.yml
      KONG_DNS_ORDER: LAST,A,AAAA
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,jwt
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ${PROJECT_ROOT:-.}/config:/etc/kong/declarative:ro
      - /etc/localtime:/etc/localtime:ro

  # === METADATOS DE DB ===
  meta:
    container_name: supabase-meta-pokevicio
    image: supabase/postgres-meta:v0.96.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 10s
      interval: 10s
      retries: 5
    environment:
      HOSTNAME: "0.0.0.0"
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_SSL: 'false'
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # === PANEL DE CONTROL (STUDIO) ===
  studio:
    container_name: supabase-studio-pokevicio
    image: supabase/studio:2026.04.27-sha-5f60601
    restart: unless-stopped
    ports:
      - ${STUDIO_PORT:-3000}:3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 10s
      interval: 10s
      retries: 5
    environment:
      HOSTNAME: "0.0.0.0"
      SUPABASE_URL: http://kong:8000
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_PUBLIC_URL: ${SITE_URL}
      IP_ALLOWLIST: 0.0.0.0/0
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # === SINCRONIZADOR DE ROLES Y SEGURIDAD ===
  db-migrator:
    container_name: supabase-db-migrator-pokevicio
    image: postgres:15
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command: >
      bash -c "
        echo '🛠️ Asegurando existencia de roles de sistema...' &&
        until psql -h db -U postgres -d postgres -c \"SELECT 1\" > /dev/null 2>&1; do sleep 2; done &&
        psql -h db -U postgres -d postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='supabase_admin'\" | grep -q 1 || psql -h db -U postgres -d postgres -c \"CREATE ROLE supabase_admin WITH NOINHERIT CREATEROLE LOGIN NOREPLICATION;\" &&
        psql -h db -U postgres -d postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='supabase_auth_admin'\" | grep -q 1 || psql -h db -U postgres -d postgres -c \"CREATE ROLE supabase_auth_admin WITH NOINHERIT LOGIN;\" &&
        psql -h db -U postgres -d postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='authenticator'\" | grep -q 1 || psql -h db -U postgres -d postgres -c \"CREATE ROLE authenticator WITH NOINHERIT LOGIN;\" &&
        psql -h db -U postgres -d postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='anon'\" | grep -q 1 || psql -h db -U postgres -d postgres -c \"CREATE ROLE anon WITH NOLOGIN NOINHERIT;\" &&
        psql -h db -U postgres -d postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='authenticated'\" | grep -q 1 || psql -h db -U postgres -d postgres -c \"CREATE ROLE authenticated WITH NOLOGIN NOINHERIT;\" &&
        psql -h db -U postgres -d postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='service_role'\" | grep -q 1 || psql -h db -U postgres -d postgres -c \"CREATE ROLE service_role WITH NOLOGIN NOINHERIT;\" &&
        echo '🏗️ Creando esquemas y extensiones de sistema...' &&
        psql -h db -U postgres -d postgres -c \"CREATE EXTENSION IF NOT EXISTS \\\"uuid-ossp\\\" SCHEMA public;\" &&
        psql -h db -U postgres -d postgres -c \"CREATE EXTENSION IF NOT EXISTS \\\"pgcrypto\\\" SCHEMA public;\" &&
        psql -h db -U postgres -d postgres -c \"CREATE EXTENSION IF NOT EXISTS \\\"pg_stat_statements\\\" SCHEMA public;\" &&
        psql -h db -U postgres -d postgres -c \"CREATE SCHEMA IF NOT EXISTS auth;\" &&
        psql -h db -U postgres -d postgres -c \"CREATE SCHEMA IF NOT EXISTS storage;\" &&
        psql -h db -U postgres -d postgres -c \"CREATE SCHEMA IF NOT EXISTS realtime;\" &&
        psql -h db -U postgres -d postgres -c \"CREATE SCHEMA IF NOT EXISTS graphql_public;\" &&
        echo '🔐 Sincronizando contraseñas y privilegios (con reintentos)...' &&
        for i in {1..5}; do
          psql -h db -U postgres -d postgres -c \"ALTER ROLE supabase_admin WITH PASSWORD '${POSTGRES_PASSWORD}';\" &&
          psql -h db -U postgres -d postgres -c \"ALTER ROLE supabase_auth_admin WITH PASSWORD '${POSTGRES_PASSWORD}';\" &&
          psql -h db -U postgres -d postgres -c \"ALTER ROLE authenticator WITH PASSWORD '${POSTGRES_PASSWORD}';\" &&
          psql -h db -U postgres -d postgres -c \"GRANT anon, authenticated, service_role TO authenticator;\" &&
          psql -h db -U postgres -d postgres -c \"GRANT ALL PRIVILEGES ON DATABASE postgres TO supabase_admin;\" &&
          psql -h db -U postgres -d postgres -c \"GRANT ALL PRIVILEGES ON SCHEMA public TO supabase_admin;\" &&
          psql -h db -U postgres -d postgres -c \"GRANT ALL PRIVILEGES ON SCHEMA public TO supabase_auth_admin;\" &&
          psql -h db -U postgres -d postgres -c \"GRANT ALL PRIVILEGES ON SCHEMA auth TO supabase_auth_admin;\" &&
          psql -h db -U postgres -d postgres -c \"GRANT ALL PRIVILEGES ON SCHEMA storage TO supabase_auth_admin;\" &&
          psql -h db -U postgres -d postgres -c \"GRANT ALL PRIVILEGES ON SCHEMA realtime TO supabase_admin;\" &&
          psql -h db -U postgres -d postgres -c \"ALTER SCHEMA public OWNER TO supabase_admin;\" &&
          psql -h db -U postgres -d postgres -c \"ALTER SCHEMA auth OWNER TO supabase_auth_admin;\" &&
          psql -h db -U postgres -d postgres -c \"ALTER SCHEMA storage OWNER TO supabase_auth_admin;\" &&
          break || sleep 5;
        done &&
        echo '✅ Sistema inicializado con éxito.'
      "

networks:
  default:
    name: supabase-network-pokevicio
